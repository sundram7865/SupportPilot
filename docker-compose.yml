services:
  urbankart-mock-api:
    build:
      context: ./apps/urbankart-mock-api
    container_name: urbankart-mock-api
    environment:
      URBANKART_API_KEY: dev_urbankart_key
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./apps/urbankart-mock-api:/app

  redis:
    image: redis:7-alpine
    container_name: supportpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: supportpilot-api
    env_file:
      - .env
    environment:
      URBANKART_BASE_URL: http://urbankart-mock-api:8001
    ports:
      - "8000:8000"
    depends_on:
      urbankart-mock-api:
        condition: service_started
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s