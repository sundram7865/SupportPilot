services:
  api:
    build:
      context: ./apps/api
    container_name: supportpilot-api-prod
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    container_name: supportpilot-worker-prod
    env_file:
      - .env
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    restart: unless-stopped

  celery-beat:
    build:
      context: ./apps/api
    container_name: supportpilot-celery-beat-prod
    env_file:
      - .env
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    restart: unless-stopped

  urbankart-mock-api:
    build:
      context: ./apps/urbankart-mock-api
    container_name: urbankart-mock-api-prod
    environment:
      URBANKART_API_KEY: dev_urbankart_key
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/api/support/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped